name: conformance

# The conformance harness. On day one this is RED — the generated stubs in
# translate.py / system.py / compensation.py raise NotImplementedError, so every
# active write verb fails. That is the point: the harness proves it detects
# non-conformance, not just conformance. As you fill the stubs, verbs flip green.

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      shim_url:
        description: "Base URL of a running shim, for the opt-in LIVE gate"
        required: false
        default: ""
      live_verb:
        description: "A write verb to exercise live, e.g. services.create_invoice"
        required: false
        default: ""

jobs:
  # Gate 1 — the offline proof. Self-contained: the shim carries its own deps
  # (fastapi / pydantic / pytest / httpx). No nilscript install needed here.
  offline:
    name: offline proof (FakeSystem)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the shim
        run: pip install -e ".[dev]"
      - name: Conformance proof — every active write verb must reach `executed`
        run: pytest -q

  # Gate 2 — manifest honesty. The committed requirements-manifest.json must be
  # structurally valid. Needs the kernel CLI.
  #   TODO(once the kernel is on PyPI): replace the git install with `pip install nilscript[cli]`.
  manifest:
    name: manifest validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the nilscript CLI
        run: pip install "nilscript[cli] @ git+https://github.com/nilscript-org/nilscript.git"
      - name: Validate the requirements manifest
        run: nilscript manifest validate requirements-manifest.json

  # Gate 3 — the LIVE proof. Opt-in via "Run workflow" with a shim_url + a verb,
  # because it needs your backend reachable. conformance-test runs ONE verb per
  # call (including its rollback-honesty rows); list each of your write verbs as a
  # step, or fan out with a matrix, to cover the full surface.
  live:
    name: live conformance (opt-in)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.shim_url != '' && inputs.live_verb != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the shim and the nilscript CLI
        run: |
          pip install -e ".[dev]"
          pip install "nilscript[cli] @ git+https://github.com/nilscript-org/nilscript.git"
      - name: Live conformance for one verb (incl. its rollback-honesty tier)
        run: nilscript conformance-test --url "${{ inputs.shim_url }}" --verb "${{ inputs.live_verb }}"
